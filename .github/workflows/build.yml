name: Build APK

on:
  push:
    branches: [ Dusri-branch ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Decode fixed debug keystore
        run: echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > debug.keystore

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  # One-off helper job: prints the release keystore's SHA-1/SHA-256 fingerprints to
  # the Actions log so they can be copied into Firebase Console > Project Settings >
  # Your apps > Add fingerprint (needed for Phone Auth OTP to work on release builds).
  # Only runs when manually triggered ("Run workflow" button), not on every push.
  # Requires one repository secret: RELEASE_STORE_PASSWORD (the password chosen when
  # release.keystore was created — see release-signing-setup.md).
  print-release-sha1:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Decode release keystore
        run: base64 -d keystore_b64.txt > release.keystore

      - name: Print SHA-1 / SHA-256 fingerprints
        run: |
          keytool -list -v -keystore release.keystore -alias ibtisaam \
            -storepass "${{ secrets.RELEASE_STORE_PASSWORD }}" | grep -E "SHA1:|SHA256:|Alias name:"
