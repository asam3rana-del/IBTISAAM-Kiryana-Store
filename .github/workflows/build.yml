name: Build APK

on:
  push:
    branches: [ "main", "New-structure" ]
  pull_request:
    branches: [ "main", "New-structure" ]
  workflow_dispatch:

# If a new push/PR update comes in while a run is still going, cancel the
# older run for that same branch/PR instead of letting both finish.
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate and decode debug keystore
        run: |
          if [ -z "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" ]; then
            echo "::error::DEBUG_KEYSTORE_BASE64 secret is empty or not set. Refusing to create an empty/invalid keystore."
            exit 1
          fi
          echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > debug.keystore
          if [ ! -s debug.keystore ]; then
            echo "::error::Decoded debug.keystore is empty — DEBUG_KEYSTORE_BASE64 secret is likely invalid base64."
            exit 1
          fi
          # A real JKS/PKCS12 keystore is a zip-like binary; a bad secret usually
          # decodes to plain/short garbage. Catch that case explicitly too.
          if ! file debug.keystore | grep -qiE 'zip|java keystore|data'; then
            echo "::error::Decoded debug.keystore does not look like a valid keystore file."
            exit 1
          fi
          echo "debug.keystore decoded and looks valid ($(stat -c%s debug.keystore) bytes)"

      - name: Verify project configuration
        run: |
          test -f app/google-services.json
          grep -q 'com.google.gms.google-services' app/build.gradle.kts
          echo "Firebase config present"

      - name: Select Gradle command
        id: gradle_cmd
        run: |
          if [ -x ./gradlew ]; then
            echo "cmd=./gradlew" >> "$GITHUB_OUTPUT"
            echo "Using project Gradle wrapper (./gradlew)"
          else
            echo "cmd=gradle" >> "$GITHUB_OUTPUT"
            echo "::warning::gradlew not found in repo — falling back to the Gradle installed by setup-gradle. Run the 'Generate Gradle Wrapper' workflow to add it."
          fi

      - name: Run lint
        run: ${{ steps.gradle_cmd.outputs.cmd }} lintDebug

      - name: Upload lint results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-results
          path: app/build/reports/lint-results-debug.html
          retention-days: 5

      - name: Run unit tests
        run: ${{ steps.gradle_cmd.outputs.cmd }} testDebugUnitTest

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: app/build/reports/tests/testDebugUnitTest
          retention-days: 5

      - name: Build Debug APK
        run: ${{ steps.gradle_cmd.outputs.cmd }} assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
